<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hunsterverse MHFZ: Catalog</title>
    <meta name="description" content="Items and equipment available on the Hunsterverse Monster Hunter Frontier Z server." />
    <meta name="theme-color" content="#150e09" />
    <link rel="icon" href="/assets/favicon.png" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>

  <body class="public-page">
    <header class="site-nav">
      <div class="wrap">
        <a class="brand" href="/">Hunsterverse<small>Monster Hunter Frontier Z</small></a>
        <nav>
          <a class="navlink" href="/guilds.html">Guilds</a>
          <a class="navlink" href="/hunters.html">Hunters</a>
          <a class="navlink" href="/catalog.html" aria-current="page">Catalog</a>
          <a class="navlink" href="/worlds.html">Worlds</a>
          <a class="navlink" href="/guide-linux.html">Guides</a>
          <a class="navlink" href="/account.html">Account</a>
          <a class="navlink" href="https://discord.gg/YuE42eh">Discord</a>
        </nav>
      </div>
    </header>

    <main class="wrap page">
      <header class="page-head">
        <p class="kicker">HV MHFZ / Library</p>
        <h1>Catalog</h1>
        <p class="page-sub">Every item and piece of equipment in the game, straight from the server database. <span id="catalog-total"></span></p>
      </header>

      <section class="panel">
        <div class="chips" id="catalog-slots" role="group" aria-label="Catalog section">
          <button type="button" class="chip" data-slot="items" aria-pressed="true">Items</button>
          <button type="button" class="chip" data-slot="melee" aria-pressed="false">Melee</button>
          <button type="button" class="chip" data-slot="ranged" aria-pressed="false">Ranged</button>
          <button type="button" class="chip" data-slot="heads" aria-pressed="false">Heads</button>
          <button type="button" class="chip" data-slot="chests" aria-pressed="false">Chests</button>
          <button type="button" class="chip" data-slot="arms" aria-pressed="false">Arms</button>
          <button type="button" class="chip" data-slot="waists" aria-pressed="false">Waists</button>
          <button type="button" class="chip" data-slot="legs" aria-pressed="false">Legs</button>
        </div>

        <div class="toolbar">
          <label class="search">
            <span class="search-label">Search</span>
            <input type="search" id="catalog-search" placeholder="Name or id" autocomplete="off" />
          </label>
          <span class="toolbar-note" id="catalog-results"></span>
        </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Id</th><th>Name</th></tr></thead>
            <tbody id="catalog-body">
              <tr><td colspan="2"><span class="skeleton-line w70"></span></td></tr>
            </tbody>
          </table>
        </div>

        <div class="pager" id="catalog-pager" hidden>
          <button type="button" class="ghost-btn small" id="catalog-prev">Previous</button>
          <span class="pager-note" id="catalog-page-note"></span>
          <button type="button" class="ghost-btn small" id="catalog-next">Next</button>
        </div>
      </section>
    </main>

    <p class="site-foot">Hunsterverse, a Monster Hunter Frontier Z private server. Not affiliated with Capcom.</p>

    <script src="/js/catalog.js"></script>
  </body>
</html>
